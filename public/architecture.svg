<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7ba8" />
    </marker>
    <linearGradient id="appGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <rect width="1550" height="880" fill="#fbfbff" />

  <!-- Title -->
  <text x="775" y="72" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">ApexPulse Modular Monolith Architecture</text>
  <text x="775" y="108" text-anchor="middle" font-size="16" fill="#334155">ApexPulse is built as a modular monolith with a unified Next.js app, shared database,</text>
  <text x="775" y="132" text-anchor="middle" font-size="16" fill="#334155">and a dedicated <tspan font-weight="700">cron worker</tspan> for background processing -- now spanning Crypto, Trading 212, and Nigeria Stock (NGX).</text>

  <!-- Browser / laptop icon -->
  <g transform="translate(100,210)">
    <rect x="10" y="10" width="120" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
    <rect x="20" y="20" width="100" height="55" rx="2" fill="#eff6ff" stroke="#93c5fd" />
    <rect x="0" y="85" width="140" height="8" rx="3" fill="#1e3a8a" />
    <text x="70" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Next.js App Router</text>
    <text x="70" y="138" text-anchor="middle" font-size="13" fill="#475569">Tabs: Crypto / Trading212 / NGX</text>
    <text x="70" y="155" text-anchor="middle" font-size="13" fill="#475569">TanStack Query + Tremor</text>
  </g>
  <path d="M240,248 H400 V300" fill="none" stroke="#5b7ba8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Binance cloud icon -->
  <g transform="translate(830,150)">
    <ellipse cx="70" cy="42" rx="68" ry="40" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
    <text x="70" y="53" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">B</text>
    <text x="70" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Binance</text>
    <text x="70" y="120" text-anchor="middle" font-size="11" fill="#475569">REST -- crypto data</text>
  </g>

  <!-- APP box -->
  <rect x="360" y="300" width="420" height="180" rx="16" fill="url(#appGrad)" />
  <text x="570" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">APP (Next.js)</text>
  <line x1="380" y1="356" x2="760" y2="356" stroke="#93c5fd" stroke-opacity="0.6" />
  <text x="400" y="382" font-size="14" fill="#eff6ff">NextAuth v5 (Prisma)</text>
  <text x="400" y="406" font-size="14" fill="#eff6ff">Holdings / Signals / Settings</text>
  <text x="400" y="430" font-size="14" font-weight="700" fill="#ffffff">Pricing Engine (lib/pricing.ts)</text>
  <text x="400" y="452" font-size="12" fill="#dbeafe">routes each holding by asset class/market,</text>
  <text x="400" y="468" font-size="12" fill="#dbeafe">converts every source to USD</text>

  <!-- PostgreSQL cylinder -->
  <g transform="translate(830,335)">
    <ellipse cx="70" cy="20" rx="70" ry="20" fill="#94a3b8" />
    <rect x="0" y="20" width="140" height="70" fill="#cbd5e1" />
    <ellipse cx="70" cy="90" rx="70" ry="20" fill="#94a3b8" />
    <ellipse cx="70" cy="20" rx="70" ry="20" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <line x1="0" y1="45" x2="0" y2="90" stroke="#64748b" />
    <line x1="140" y1="45" x2="140" y2="90" stroke="#64748b" />
    <text x="70" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PostgreSQL</text>
    <text x="70" y="140" text-anchor="middle" font-size="12" fill="#475569">(via Prisma ORM)</text>
  </g>

  <!-- Connections: laptop->app already drawn. app<->db, app<->binance -->
  <path d="M780,390 H830" fill="none" stroke="#5b7ba8" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M830,412 H780" fill="none" stroke="#5b7ba8" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M765,300 L858,227" fill="none" stroke="#5b7ba8" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M845,238 L752,312" fill="none" stroke="#5b7ba8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Right column: external services -->
  <g font-size="16">
    <!-- Binance REST -->
    <rect x="1130" y="195" width="380" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" />
    <text x="1155" y="225" font-weight="700" fill="#0f172a">Binance REST</text>
    <text x="1155" y="246" font-size="12" fill="#64748b">Crypto balances, trades, prices</text>

    <!-- Trading212 -->
    <rect x="1130" y="277" width="380" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" />
    <text x="1155" y="307" font-weight="700" fill="#0f172a">Trading 212 API (read-only)</text>
    <text x="1155" y="328" font-size="12" fill="#64748b">Stock positions + order history, auto-synced</text>

    <!-- Mansa/NGX -->
    <rect x="1130" y="359" width="380" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" />
    <text x="1155" y="389" font-weight="700" fill="#0f172a">Mansa API -&gt; free NGX scraper</text>
    <text x="1155" y="410" font-size="12" fill="#64748b">Nigeria Stock prices, NGN converted to USD</text>

    <!-- Yahoo Finance -->
    <rect x="1130" y="441" width="380" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" />
    <text x="1155" y="471" font-weight="700" fill="#0f172a">Yahoo Finance</text>
    <text x="1155" y="492" font-size="12" fill="#64748b">US stock quotes + live FX rates (free, no key)</text>

    <!-- LLMs -->
    <rect x="1130" y="523" width="380" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" />
    <text x="1155" y="553" font-weight="700" fill="#0f172a">LLMs</text>
    <text x="1155" y="574" font-size="12" fill="#64748b">OpenAI (primary) -&gt; DeepSeek (fallback), 80%+ gate</text>

    <!-- Resend -->
    <rect x="1130" y="605" width="380" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" />
    <text x="1155" y="635" font-weight="700" fill="#0f172a">Resend Email</text>
    <text x="1155" y="656" font-size="12" fill="#64748b">React Email, daily brief</text>
  </g>

  <path d="M970,375 H1130 V230" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M970,395 H1050 V312" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M970,405 H1010 V394" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M780,440 C 950,440 1000,440 1130,394" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M780,455 C 950,470 1000,480 1130,476" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M970,415 H1000 V558" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M970,425 H1020 V640" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Cron worker gear/clock icon -->
  <g transform="translate(420,600)">
    <circle cx="45" cy="45" r="42" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <circle cx="45" cy="45" r="26" fill="#ffffff" stroke="#334155" stroke-width="2" />
    <line x1="45" y1="45" x2="45" y2="28" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="45" x2="58" y2="52" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <text x="45" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Cron Worker</text>
    <text x="45" y="134" text-anchor="middle" font-size="12" fill="#475569">(tsx scripts/cron.ts)</text>
  </g>
  <path d="M465,600 V480 H570" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M510,645 H830 V425" fill="none" stroke="#5b7ba8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M510,660 C 800,700 1000,650 1130,230" fill="none" stroke="#5b7ba8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="700" y="700" font-size="12" fill="#64748b">Syncs Binance, generates AI signals, sends the daily email</text>

  <!-- Optional row -->
  <g font-size="15">
    <rect x="420" y="770" width="380" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" />
    <text x="445" y="805" font-weight="700" fill="#0f172a">Redis <tspan font-style="italic" font-weight="400">(Optional)</tspan></text>
    <text x="445" y="826" font-size="12" fill="#64748b">Cache / rate limits -- reserved for future use</text>

    <rect x="1130" y="687" width="380" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" />
    <text x="1155" y="722" font-weight="700" fill="#0f172a">GitHub Actions <tspan font-style="italic" font-weight="400">(Optional)</tspan></text>
    <text x="1155" y="743" font-size="12" fill="#64748b">Alternative scheduler for the cron job</text>
  </g>

  <text x="775" y="866" text-anchor="middle" font-size="13" fill="#94a3b8">Every price source is best-effort: a failure degrades gracefully to a holding's own cost basis, it never breaks the dashboard.</text>
</svg>
