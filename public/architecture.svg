<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <style>
      .box { rx: 10; stroke-width: 1.5; }
      .title { font-weight: 700; }
      .lbl { font-size: 13px; fill: #e2e8f0; }
      .sub { font-size: 11px; fill: #94a3b8; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="900" fill="#0b1120" />

  <!-- Title -->
  <text x="30" y="36" class="lbl title" font-size="20" fill="#f1f5f9">ApexPulse Architecture</text>
  <text x="30" y="56" class="sub">Crypto (Binance) + Trading 212 + Nigeria Stock (NGX) -- one self-hosted dashboard</text>

  <!-- Browser layer -->
  <rect x="30" y="80" width="1180" height="90" rx="10" fill="#111827" stroke="#22d3ee" />
  <text x="50" y="104" class="lbl title" fill="#22d3ee">Browser -- Next.js App Router (client components)</text>
  <text x="50" y="126" class="lbl">Dashboard tabs: Crypto (default) -&gt; Trading 212 -&gt; Nigeria Stock -&gt; Other Stocks</text>
  <text x="50" y="146" class="sub">TanStack Query (15s polling, shared cache across tabs) + Tremor/Recharts (Price Glide, Dominance) + react-hook-form</text>

  <line x1="620" y1="170" x2="620" y2="196" class="edge" />

  <!-- API layer -->
  <rect x="30" y="198" width="1180" height="80" rx="10" fill="#111827" stroke="#3b82f6" />
  <text x="50" y="222" class="lbl title" fill="#60a5fa">Next.js API Routes</text>
  <text x="50" y="244" class="lbl">/api/holdings  /api/prices  /api/stock-quote  /api/fx  /api/signals  /api/settings</text>
  <text x="50" y="262" class="lbl">/api/sync/binance  /api/sync/trading212  /api/transactions  /api/cron/daily</text>

  <line x1="200" y1="278" x2="200" y2="304" class="edge" />
  <line x1="620" y1="278" x2="620" y2="304" class="edge" />
  <line x1="1040" y1="278" x2="1040" y2="304" class="edge" />

  <!-- Auth -->
  <rect x="30" y="306" width="340" height="70" rx="10" fill="#111827" stroke="#a855f7" />
  <text x="50" y="330" class="lbl title" fill="#c084fc">Auth</text>
  <text x="50" y="350" class="lbl">NextAuth v5 + Prisma Adapter</text>
  <text x="50" y="366" class="sub">Credentials + Google OAuth</text>

  <!-- Pricing engine -->
  <rect x="410" y="306" width="420" height="220" rx="10" fill="#111827" stroke="#10b981" />
  <text x="430" y="330" class="lbl title" fill="#34d399">Pricing Engine (lib/pricing.ts)</text>
  <text x="430" y="348" class="sub">Fans out per holding's assetClass/market, merges back into one USD-denominated price list</text>

  <rect x="430" y="360" width="180" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.6"/>
  <text x="442" y="378" class="lbl">Crypto</text>
  <text x="442" y="394" class="sub">Binance bulk + per-symbol fallback</text>

  <rect x="620" y="360" width="190" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.6"/>
  <text x="632" y="378" class="lbl">US stocks</text>
  <text x="632" y="394" class="sub">Yahoo Finance (free, no key)</text>

  <rect x="430" y="418" width="180" height="60" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="442" y="436" class="lbl">Trading 212</text>
  <text x="442" y="452" class="sub">Synced snapshot, converted to</text>
  <text x="442" y="466" class="sub">USD once at sync time</text>

  <rect x="620" y="418" width="190" height="60" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="632" y="436" class="lbl">Nigeria Stock (NGX)</text>
  <text x="632" y="452" class="sub">Mansa API primary,</text>
  <text x="632" y="466" class="sub">free scraper fallback</text>

  <text x="430" y="500" class="sub">-&gt; lib/fx.ts converts GBP/NGN -&gt; USD; missing quotes fall back to a holding's own cost basis so it never vanishes</text>

  <!-- AI signals -->
  <rect x="860" y="306" width="350" height="220" rx="10" fill="#111827" stroke="#ec4899" />
  <text x="880" y="330" class="lbl title" fill="#f472b6">AI Swing Signals (lib/ai.ts)</text>
  <text x="880" y="350" class="sub">Real Binance market data (top-volume + your holdings)</text>
  <text x="880" y="368" class="sub">-&gt; due-diligence prompt (trend, liquidity,</text>
  <text x="880" y="384" class="sub">   upside room, risk/reward)</text>
  <rect x="880" y="398" width="150" height="40" rx="8" fill="#0f172a" stroke="#ec4899" stroke-opacity="0.6"/>
  <text x="892" y="422" class="lbl">OpenAI (primary)</text>
  <rect x="1040" y="398" width="150" height="40" rx="8" fill="#0f172a" stroke="#ec4899" stroke-opacity="0.6"/>
  <text x="1052" y="422" class="lbl">DeepSeek (fallback)</text>
  <text x="880" y="462" class="sub">Hard backend gate: only confidence &gt;=80 AND a</text>
  <text x="880" y="478" class="sub">symbol from the real snapshot survives -- an empty</text>
  <text x="880" y="494" class="sub">result is a valid, honest outcome.</text>

  <line x1="200" y1="376" x2="200" y2="406" class="edge" />
  <line x1="620" y1="526" x2="620" y2="556" class="edge" />
  <line x1="1035" y1="526" x2="1035" y2="556" class="edge" />

  <!-- Database -->
  <rect x="30" y="558" width="1180" height="80" rx="10" fill="#111827" stroke="#0ea5e9" />
  <text x="50" y="582" class="lbl title" fill="#38bdf8">PostgreSQL via Prisma</text>
  <text x="50" y="604" class="lbl">User, ApiSetting, Holding (assetClass / market / source / lastPriceUsd), Transaction, Signal</text>
  <text x="50" y="622" class="sub">Every holding is tagged by source (binance / trading212 / bamboo / cscs / manual) so brokers never collide</text>

  <line x1="620" y1="638" x2="620" y2="664" class="edge" />

  <!-- Cron -->
  <rect x="30" y="666" width="560" height="90" rx="10" fill="#111827" stroke="#eab308" />
  <text x="50" y="690" class="lbl title" fill="#facc15">Cron container (scripts/cron.ts)</text>
  <text x="50" y="712" class="lbl">Scheduled Binance sync -&gt; AI signals -&gt; daily Resend email</text>
  <text x="50" y="732" class="sub">Runs independently of the web app; same Postgres, same pricing/AI libs</text>

  <!-- External services -->
  <rect x="620" y="666" width="590" height="180" rx="10" fill="#111827" stroke="#64748b" />
  <text x="640" y="690" class="lbl title" fill="#cbd5e1">External Services</text>
  <text x="640" y="712" class="lbl">Binance REST -- balances, trades, crypto prices</text>
  <text x="640" y="732" class="lbl">Trading 212 Public API -- positions + order history (read-only)</text>
  <text x="640" y="752" class="lbl">Mansa API + afx.kwayisi.org -- NGX stock prices (primary + fallback)</text>
  <text x="640" y="772" class="lbl">Yahoo Finance -- US stock + FX rates (free, no key)</text>
  <text x="640" y="792" class="lbl">OpenAI / DeepSeek -- AI swing signals</text>
  <text x="640" y="812" class="lbl">Resend -- daily email delivery</text>
  <text x="640" y="832" class="sub">Every source is best-effort: a failure degrades gracefully, it never crashes the dashboard</text>

  <line x1="590" y1="756" x2="620" y2="756" class="edge" stroke-dasharray="4 3" />
</svg>
